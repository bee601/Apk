<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f0;
    --surface: #ffffff;
    --surface-2: #f2ebe0;
    --ink: #221f26;
    --ink-soft: #746d7a;
    --ink-faint: #a89fae;
    --line: #e6ddce;
    --accent: #ffb0f0;
    --accent-ink: #5a1a4d;
    --accent-soft: #fff1fb;
    --daily: #a9d9bd;
    --weekly: #b9c8f2;
    --monthly: #f2c98a;
    --once: #ffb0f0;
    --danger: #d97878;
    --shadow: 0 1px 2px rgba(40, 30, 20, 0.06), 0 8px 20px -10px rgba(40, 30, 20, 0.12);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18161b;
      --surface: #221f26;
      --surface-2: #2a2731;
      --ink: #f2ede8;
      --ink-soft: #b0a8b8;
      --ink-faint: #746d7a;
      --line: #3a3542;
      --accent: #ffb0f0;
      --accent-ink: #2c0a26;
      --accent-soft: #35222f;
      --daily: #6fae8b;
      --weekly: #7f92dd;
      --monthly: #d1a463;
      --once: #ffb0f0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #18161b;
    --surface: #221f26;
    --surface-2: #2a2731;
    --ink: #f2ede8;
    --ink-soft: #b0a8b8;
    --ink-faint: #746d7a;
    --line: #3a3542;
    --accent: #ffb0f0;
    --accent-ink: #2c0a26;
    --accent-soft: #35222f;
    --daily: #6fae8b;
    --weekly: #7f92dd;
    --monthly: #d1a463;
    --once: #ffb0f0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: 34px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .brand p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .new-btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease;
  }
  .new-btn:hover { transform: translateY(-1px); }
  .new-btn:active { transform: translateY(0); }

  /* ---------- Week nav ---------- */
  .weeknav {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .weeknav button {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .weeknav button:hover { border-color: var(--accent); }
  .weeknav .range {
    font-size: 14.5px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .weeknav .today {
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    width: auto;
    padding: 0 14px;
    height: 32px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .weeknav .today:hover { border-color: var(--accent); color: var(--ink); }
  .weeknav .cal-wrap { margin-left: auto; position: relative; }
  .cal-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    height: 32px;
    padding: 0 14px 0 12px;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .cal-btn:hover, .cal-btn.active { border-color: var(--accent); color: var(--ink); }
  .cal-btn svg { flex: none; }

  /* ---------- Calendar popover ---------- */
  .cal-pop {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 280px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 20px 50px -18px rgba(0,0,0,.28);
    padding: 14px 14px 12px;
    z-index: 30;
    display: none;
  }
  .cal-pop.open { display: block; }
  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-head .cal-month {
    font-family: "Fraunces", Georgia, serif;
    font-size: 15.5px;
    font-weight: 500;
  }
  .cal-head button {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-head button:hover { border-color: var(--accent); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
  }
  .cal-dow {
    font-size: 10.5px;
    color: var(--ink-faint);
    padding: 4px 0 6px;
  }
  .cal-day {
    position: relative;
    border: none;
    background: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    padding: 7px 0;
    border-radius: 9px;
    cursor: pointer;
  }
  .cal-day:hover { background: var(--surface-2); }
  .cal-day.muted { color: var(--ink-faint); }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }
  .cal-day.in-week { background: var(--accent-soft); }
  .cal-day.selected { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .cal-day .has-task {
    position: absolute;
    bottom: 3px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent-ink);
    opacity: .55;
  }
  .cal-day.selected .has-task { background: var(--accent-ink); opacity: .8; }

  /* ---------- Legend ---------- */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(7, minmax(150px, 1fr));
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
    scroll-snap-type: x proximity;
  }
  .col {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    scroll-snap-align: start;
  }
  .col.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .col-head {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .col-head .dow {
    font-size: 11.5px;
    text-transform: lowercase;
    letter-spacing: .02em;
    color: var(--ink-faint);
  }
  .col-head .dnum {
    font-family: "Fraunces", Georgia, serif;
    font-size: 24px;
    font-weight: 400;
    margin-top: 1px;
  }
  .col.is-today .dnum { color: var(--accent-ink); }
  .col.is-today .dnum::after {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-left: 8px;
    vertical-align: middle;
  }
  .tasks {
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .empty {
    color: var(--ink-faint);
    font-size: 13px;
    padding: 10px 4px;
    line-height: 1.5;
  }
  .task {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 9px 10px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    position: relative;
  }
  .task .check {
    width: 17px; height: 17px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-faint);
    flex: none;
    margin-top: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  .task.done .check { background: var(--accent); border-color: var(--accent); }
  .task.done .check::after {
    content: "";
    width: 6px; height: 3px;
    border-left: 1.5px solid var(--accent-ink);
    border-bottom: 1.5px solid var(--accent-ink);
    transform: rotate(-45deg) translate(0.5px, -1px);
  }
  .task .body { flex: 1; min-width: 0; }
  .task .title {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.35;
    word-break: break-word;
  }
  .task.done .title { color: var(--ink-faint); text-decoration: line-through; }
  .task .notes {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
    line-height: 1.4;
    word-break: break-word;
  }
  .task .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .task .tag .dot { width: 6px; height: 6px; }
  .task .del {
    border: none; background: none; color: var(--ink-faint);
    cursor: pointer; font-size: 15px; line-height: 1;
    padding: 2px 4px; margin-top: 1px; border-radius: 6px;
    flex: none;
  }
  .task .del:hover { color: var(--danger); background: rgba(217,120,120,.12); }
  .col-add {
    border: none;
    background: none;
    color: var(--ink-faint);
    text-align: left;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    border-radius: 8px;
    margin: 0 2px 8px;
  }
  .col-add:hover { color: var(--accent-ink); background: var(--accent-soft); }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,16,14,.42);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 18px;
    width: 100%;
    max-width: 420px;
    padding: 22px 22px 18px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.35);
  }
  .modal h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 21px;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .field input:focus, .field textarea:focus, .seg button:focus-visible, .wk button:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field textarea { resize: vertical; min-height: 48px; }
  .seg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .seg button {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-soft);
    padding: 8px 4px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .seg button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .wk { display: flex; gap: 6px; flex-wrap: wrap; }
  .wk button {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-soft);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .wk button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .hint { font-size: 12px; color: var(--ink-faint); }
  .modal-actions {
    display: flex; gap: 10px; margin-top: 18px;
  }
  .modal-actions button {
    flex: 1;
    border-radius: 10px;
    padding: 11px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    border: none;
  }
  .btn-cancel { background: var(--surface-2); color: var(--ink); }
  .btn-save { background: var(--accent); color: var(--accent-ink); }

  @media (max-width: 760px) {
    .board { grid-auto-flow: column; grid-auto-columns: 74%; grid-template-columns: none; }
    header { align-items: center; }
    .brand h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>Board</h1>
      <p>Tasks, sorted by when they happen.</p>
    </div>
    <button class="new-btn" id="newBtn">+ New task</button>
  </header>

  <div class="weeknav">
    <button id="prevWk" aria-label="Previous week">‹</button>
    <div class="range" id="weekRange"></div>
    <button id="nextWk" aria-label="Next week">›</button>
    <button class="today" id="todayBtn">Today</button>
    <div class="cal-wrap">
      <button class="cal-btn" id="calBtn" aria-label="Find a day">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        Find a day
      </button>
      <div class="cal-pop" id="calPop">
        <div class="cal-head">
          <button type="button" id="calPrev" aria-label="Previous month">‹</button>
          <div class="cal-month" id="calMonthLabel"></div>
          <button type="button" id="calNext" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--once)"></span>on a date</span>
    <span><span class="dot" style="background:var(--daily)"></span>every day</span>
    <span><span class="dot" style="background:var(--weekly)"></span>every week</span>
    <span><span class="dot" style="background:var(--monthly)"></span>every month</span>
  </div>

  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>New task</h2>
    <div class="field">
      <label for="tTitle">Task</label>
      <input type="text" id="tTitle" placeholder="Water the plants" maxlength="80">
    </div>
    <div class="field">
      <label for="tNotes">Notes (optional)</label>
      <textarea id="tNotes" placeholder="Any details"></textarea>
    </div>
    <div class="field">
      <label>Repeats</label>
      <div class="seg" id="typeSeg">
        <button type="button" data-type="once" class="active">Once</button>
        <button type="button" data-type="daily">Every day</button>
        <button type="button" data-type="weekly">Every week</button>
        <button type="button" data-type="monthly">Every month</button>
      </div>
    </div>

    <div class="field" id="onceField">
      <label for="tDate">Date</label>
      <input type="date" id="tDate">
    </div>
    <div class="field" id="weeklyField" style="display:none">
      <label>Which day</label>
      <div class="wk" id="wkPicker"></div>
    </div>
    <div class="field" id="monthlyField" style="display:none">
      <label for="tMonthDay">Day of the month</label>
      <input type="number" id="tMonthDay" min="1" max="31" placeholder="e.g. 23">
      <div class="hint" style="margin-top:6px">Repeats on this date every month.</div>
    </div>
    <div class="field" id="dailyField" style="display:none">
      <div class="hint">Shows up on every column, every week.</div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Add task</button>
    </div>
  </div>
</div>

<script>
(function(){
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const WK_LABELS = ["Mo","Tu","We","Th","Fr","Sa","Su"]; // display order Mon->Sun
  const WK_JS = [1,2,3,4,5,6,0]; // maps display index -> JS getDay() value

  const store = {
    load(key, fallback){
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch(e){ return fallback; }
    },
    save(key, val){
      try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
    }
  };

  let tasks = store.load('board.tasks', []);
  let completions = new Set(store.load('board.completions', []));

  function saveTasks(){ store.save('board.tasks', tasks); }
  function saveCompletions(){ store.save('board.completions', Array.from(completions)); }

  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function startOfWeek(d){
    const day = d.getDay(); // 0 Sun .. 6 Sat
    const diff = (day === 0 ? -6 : 1 - day); // move to Monday
    const monday = new Date(d);
    monday.setDate(d.getDate() + diff);
    monday.setHours(0,0,0,0);
    return monday;
  }

  let weekStart = startOfWeek(new Date());
  const todayIso = isoDate(new Date());

  function fmtRange(start){
    const end = new Date(start); end.setDate(start.getDate()+6);
    const opts = { month: 'short', day: 'numeric' };
    const s = start.toLocaleDateString(undefined, opts);
    const e = end.toLocaleDateString(undefined, opts);
    return s + ' – ' + e + ', ' + end.getFullYear();
  }

  function tasksForDate(date){
    const iso = isoDate(date);
    const jsDow = date.getDay();
    const mDay = date.getDate();
    return tasks.filter(t => {
      if (t.type === 'once') return t.date === iso;
      if (t.type === 'daily') return true;
      if (t.type === 'weekly') return t.weekday === jsDow;
      if (t.type === 'monthly') return t.monthDay === mDay;
      return false;
    });
  }

  function render(){
    document.getElementById('weekRange').textContent = fmtRange(weekStart);
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
      const iso = isoDate(d);
      const col = document.createElement('div');
      col.className = 'col' + (iso === todayIso ? ' is-today' : '');

      const head = document.createElement('div');
      head.className = 'col-head';
      head.innerHTML = '<div class="dow">'+DOW[d.getDay()]+'</div><div class="dnum">'+d.getDate()+'</div>';
      col.appendChild(head);

      const list = document.createElement('div');
      list.className = 'tasks';
      const dayTasks = tasksForDate(d).sort((a,b)=>{
        const doneA = completions.has(a.id+'|'+iso), doneB = completions.has(b.id+'|'+iso);
        if (doneA !== doneB) return doneA ? 1 : -1;
        return a.createdAt - b.createdAt;
      });

      if (dayTasks.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Nothing here yet.';
        list.appendChild(empty);
      }

      dayTasks.forEach(t => {
        const done = completions.has(t.id+'|'+iso);
        const row = document.createElement('div');
        row.className = 'task' + (done ? ' done' : '');
        const dotColor = 'var(--'+t.type+')';
        const tagText = t.type === 'once' ? 'once' : t.type === 'daily' ? 'daily' : t.type === 'weekly' ? 'weekly' : 'monthly';
        row.innerHTML =
          '<button class="check" aria-label="Toggle done"></button>' +
          '<div class="body">' +
            '<div class="title"></div>' +
            (t.notes ? '<div class="notes"></div>' : '') +
            '<div class="tag"><span class="dot" style="background:'+dotColor+'"></span>'+tagText+'</div>' +
          '</div>' +
          '<button class="del" aria-label="Delete task">×</button>';
        row.querySelector('.title').textContent = t.title;
        if (t.notes) row.querySelector('.notes').textContent = t.notes;
        row.querySelector('.check').addEventListener('click', () => {
          const key = t.id+'|'+iso;
          if (completions.has(key)) completions.delete(key); else completions.add(key);
          saveCompletions(); render();
        });
        row.querySelector('.del').addEventListener('click', () => {
          tasks = tasks.filter(x => x.id !== t.id);
          saveTasks(); render();
        });
        list.appendChild(row);
      });

      col.appendChild(list);

      const addBtn = document.createElement('button');
      addBtn.className = 'col-add';
      addBtn.textContent = '+ add to this day';
      addBtn.addEventListener('click', () => openModal(iso));
      col.appendChild(addBtn);

      board.appendChild(col);
    }
  }

  // ---- Modal ----
  const overlay = document.getElementById('overlay');
  const typeSeg = document.getElementById('typeSeg');
  const onceField = document.getElementById('onceField');
  const weeklyField = document.getElementById('weeklyField');
  const monthlyField = document.getElementById('monthlyField');
  const dailyField = document.getElementById('dailyField');
  const wkPicker = document.getElementById('wkPicker');
  let currentType = 'once';
  let selectedWeekday = new Date().getDay();

  WK_LABELS.forEach((label, idx) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    b.dataset.jsday = WK_JS[idx];
    if (parseInt(b.dataset.jsday) === selectedWeekday) b.classList.add('active');
    b.addEventListener('click', () => {
      selectedWeekday = parseInt(b.dataset.jsday);
      wkPicker.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
    wkPicker.appendChild(b);
  });

  function setType(type){
    currentType = type;
    typeSeg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
    onceField.style.display = type === 'once' ? '' : 'none';
    weeklyField.style.display = type === 'weekly' ? '' : 'none';
    monthlyField.style.display = type === 'monthly' ? '' : 'none';
    dailyField.style.display = type === 'daily' ? '' : 'none';
  }
  typeSeg.addEventListener('click', e => {
    const btn = e.target.closest('button[data-type]');
    if (btn) setType(btn.dataset.type);
  });

  function openModal(prefillDate){
    document.getElementById('tTitle').value = '';
    document.getElementById('tNotes').value = '';
    document.getElementById('tMonthDay').value = '';
    document.getElementById('tDate').value = prefillDate || todayIso;
    setType('once');
    overlay.classList.add('open');
    setTimeout(()=>document.getElementById('tTitle').focus(), 50);
  }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('newBtn').addEventListener('click', () => openModal(todayIso));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const title = document.getElementById('tTitle').value.trim();
    if (!title) { document.getElementById('tTitle').focus(); return; }
    const notes = document.getElementById('tNotes').value.trim();
    const task = {
      id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
      title, notes, type: currentType, createdAt: Date.now()
    };
    if (currentType === 'once'){
      task.date = document.getElementById('tDate').value || todayIso;
    } else if (currentType === 'weekly'){
      task.weekday = selectedWeekday;
    } else if (currentType === 'monthly'){
      let n = parseInt(document.getElementById('tMonthDay').value, 10);
      if (!n || n < 1) n = 1; if (n > 31) n = 31;
      task.monthDay = n;
    }
    tasks.push(task);
    saveTasks();
    closeModal();
    render();
  });

  document.getElementById('prevWk').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate()-7); render();
  });
  document.getElementById('nextWk').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate()+7); render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    weekStart = startOfWeek(new Date()); render();
  });

  // ---- Find-a-day calendar popover ----
  const calBtn = document.getElementById('calBtn');
  const calPop = document.getElementById('calPop');
  const calGrid = document.getElementById('calGrid');
  const calMonthLabel = document.getElementById('calMonthLabel');
  let calMonthCursor = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1);

  function datesWithTasks(){
    const set = new Set();
    tasks.forEach(t => { if (t.type === 'once') set.add(t.date); });
    return set;
  }

  function renderCal(){
    calMonthLabel.textContent = calMonthCursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    calGrid.innerHTML = '';
    WK_LABELS.forEach(l => {
      const el = document.createElement('div');
      el.className = 'cal-dow'; el.textContent = l;
      calGrid.appendChild(el);
    });

    const firstOfMonth = new Date(calMonthCursor.getFullYear(), calMonthCursor.getMonth(), 1);
    const gridStart = startOfWeek(firstOfMonth);
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
    const hasTask = datesWithTasks();
    const recurringDaily = tasks.some(t => t.type === 'daily');
    const recurringWeekdays = new Set(tasks.filter(t=>t.type==='weekly').map(t=>t.weekday));
    const recurringMonthDays = new Set(tasks.filter(t=>t.type==='monthly').map(t=>t.monthDay));

    for (let i=0;i<42;i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      const iso = isoDate(d);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cal-day';
      if (d.getMonth() !== calMonthCursor.getMonth()) btn.classList.add('muted');
      if (iso === todayIso) btn.classList.add('today');
      if (d >= weekStart && d <= weekEnd) btn.classList.add('in-week');
      btn.textContent = d.getDate();

      const marked = hasTask.has(iso) || recurringDaily || recurringWeekdays.has(d.getDay()) || recurringMonthDays.has(d.getDate());
      if (marked){
        const dot = document.createElement('span');
        dot.className = 'has-task';
        btn.appendChild(dot);
      }
      btn.addEventListener('click', () => {
        weekStart = startOfWeek(d);
        render();
        calMonthCursor = new Date(d.getFullYear(), d.getMonth(), 1);
        renderCal();
        closeCal();
      });
      calGrid.appendChild(btn);

      if (i >= 34 && d.getDay() === 6 && d.getMonth() !== calMonthCursor.getMonth()) break;
    }
  }

  function openCal(){
    calMonthCursor = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1);
    renderCal();
    calPop.classList.add('open');
    calBtn.classList.add('active');
  }
  function closeCal(){
    calPop.classList.remove('open');
    calBtn.classList.remove('active');
  }
  calBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    calPop.classList.contains('open') ? closeCal() : openCal();
  });
  document.getElementById('calPrev').addEventListener('click', () => {
    calMonthCursor.setMonth(calMonthCursor.getMonth()-1); renderCal();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonthCursor.setMonth(calMonthCursor.getMonth()+1); renderCal();
  });
  document.addEventListener('click', (e) => {
    if (!calPop.contains(e.target) && e.target !== calBtn) closeCal();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCal(); });

  render();
})();
</script>
</body>
</html>
